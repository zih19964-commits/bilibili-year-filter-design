<text x="68" y="382" font-size="15" fill="#806672">把不想看的年份暂时关掉，给认真创作留一点空间。</text>
<text x="68" y="411" font-size="15" fill="#806672">找回前人留下的好视频，也找回自己的审美和注意力。</text>
