<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">Bilibili Year Filter · 好内容，不该被淹没</title>
<desc id="d">白底樱粉海报：左侧是好内容不该被淹没的文案，右侧是一张倾斜的视频列表窗口与倒带符号。</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fffdfd"/><stop offset="1" stop-color="#fff2f7"/></linearGradient>
  <linearGradient id="pink" x2="1" y2="1"><stop stop-color="#ff81b3"/><stop offset="1" stop-color="#e8438a"/></linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#b94878" flood-opacity=".18"/></filter>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC','Microsoft YaHei',sans-serif}
    .orbit{transform-origin:892px 290px;animation:spin 26s linear infinite}.float{animation:float 7s ease-in-out infinite}.recent{animation:mute 6s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(-360deg)}}@keyframes float{50%{transform:translateY(-9px)}}@keyframes mute{0%,25%,100%{opacity:1}55%,80%{opacity:.35}}
    @media(prefers-reduced-motion:reduce){.orbit,.float,.recent{animation:none}.recent{opacity:.55}}
  </style>
</defs>
<rect width="1200" height="620" rx="28" fill="url(#bg)"/>
