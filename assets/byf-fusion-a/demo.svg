  <g transform="translate(858 200)"><rect width="260" height="126" rx="12" fill="#eee7ea"/><rect x="94" y="24" width="72" height="78" rx="10" fill="#fff9fb" transform="rotate(-7 130 63)"/><text x="130" y="78" text-anchor="middle" font-size="48" fill="#c4a8b5">?</text><rect x="12" y="12" width="59" height="23" rx="5" fill="#fff7fa"/><text x="41" y="28" text-anchor="middle" font-size="10" fill="#9a5f76">年份未知</text></g>
