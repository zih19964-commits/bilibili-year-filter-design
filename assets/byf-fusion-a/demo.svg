<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
<title id="t">年份筛选演示</title><desc id="d">屏蔽 2024、2025、2026 后，新年份卡片淡出，较早年份和未知年份保留。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC','Microsoft YaHei',sans-serif}.blocked{animation:hide 7s ease-in-out infinite}.dot{animation:pulse 7s ease-in-out infinite}@keyframes hide{0%,24%,100%{opacity:1;transform:translateY(0)}48%,78%{opacity:.15;transform:translateY(16px)}}@keyframes pulse{0%,24%,100%{fill:#fff}48%,78%{fill:#e94f90}}@media(prefers-reduced-motion:reduce){.blocked{animation:none;opacity:.18}.dot{animation:none;fill:#e94f90}}</style>
<rect x="1" y="1" width="1198" height="418" rx="20" fill="#fffafd" stroke="#efd9e3"/>
<text x="32" y="46" font-size="13" font-weight="700" fill="#523643">屏蔽年份</text>
<g font-size="12" text-anchor="middle"><rect x="126" y="24" width="78" height="34" rx="9" fill="#f3f0f2"/><text x="165" y="46" fill="#8a7280">2021</text><rect x="216" y="24" width="78" height="34" rx="9" fill="#e94f90"/><text x="255" y="46" fill="white">2024 ×</text><rect x="306" y="24" width="78" height="34" rx="9" fill="#e94f90"/><text x="345" y="46" fill="white">2025 ×</text><rect x="396" y="24" width="78" height="34" rx="9" fill="#e94f90"/><text x="435" y="46" fill="white">2026 ×</text></g>
<text x="1168" y="46" text-anchor="end" font-size="11" fill="#9c8390">未知年份默认保留 · 动画仅为规则示意</text>
<g transform="translate(32 91)">
  <g><rect width="260" height="126" rx="12" fill="#eadde2"/><path d="M0 105 63 46l45 54 28-26 50 45 42-52 32 39v20H0Z" fill="#997b8a"/><rect x="12" y="12" width="42" height="23" rx="5" fill="#fff7fa"/><text x="33" y="28" text-anchor="middle" font-size="10" fill="#9a5f76">2018</text><text x="0" y="151" font-size="12" font-weight="700" fill="#4d3340">一部值得慢慢看的旧作品</text></g>
  <g class="blocked" transform="translate(286)"><rect width="260" height="126" rx="12" fill="#f0a7c4"/><rect x="46" y="31" width="170" height="65" rx="8" fill="#ffd7e6"/><path d="M62 50h100m-100 14h136m-136 14h112" stroke="#d96192" stroke-width="6"/><rect x="12" y="12" width="42" height="23" rx="5" fill="#fff7fa"/><text x="33" y="28" text-anchor="middle" font-size="10" fill="#9a5f76">2025</text><text x="0" y="151" font-size="12" font-weight="700" fill="#4d3340">最近发布的视频</text></g>
  <g><rect x="572" width="260" height="126" rx="12" fill="#704257"/><path d="M600 100c50-38 80-70 128-22s70 23 86-44" fill="none" stroke="#f1bed1" stroke-width="5"/><rect x="584" y="12" width="42" height="23" rx="5" fill="#fff7fa"/><text x="605" y="28" text-anchor="middle" font-size="10" fill="#9a5f76">2021</text><text x="572" y="151" font-size="12" font-weight="700" fill="#4d3340">真正把一个原理讲明白</text></g>
  <g class="blocked" transform="translate(858)"><rect width="260" height="126" rx="12" fill="#efc0d1"/><circle cx="130" cy="63" r="45" fill="#d66b95"/><circle cx="130" cy="63" r="24" fill="#fde7ee"/><rect x="12" y="12" width="42" height="23" rx="5" fill="#fff7fa"/><text x="33" y="28" text-anchor="middle" font-size="10" fill="#9a5f76">2024</text><text x="0" y="151" font-size="12" font-weight="700" fill="#4d3340">另一条新内容</text></g>
  <g transform="translate(0 200)"><rect width="260" height="126" rx="12" fill="#f4c8d2"/><path d="M0 86h42V53h32v63h28V35h49v81h30V64h34v52h45v10H0Z" fill="#ad7087"/><rect x="12" y="12" width="42" height="23" rx="5" fill="#fff7fa"/><text x="33" y="28" text-anchor="middle" font-size="10" fill="#9a5f76">2016</text></g>
  <g class="blocked" transform="translate(286 200)"><rect width="260" height="126" rx="12" fill="#e6bbcf"/><path d="M48 32h164v62H48Z" fill="#f9d9e7"/><path d="M65 50h111m-111 15h132m-132 15h88" stroke="#be6d91" stroke-width="6"/><rect x="12" y="12" width="42" height="23" rx="5" fill="#fff7fa"/><text x="33" y="28" text-anchor="middle" font-size="10" fill="#9a5f76">2026</text></g>
